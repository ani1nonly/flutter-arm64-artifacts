name: Build Flutter linux-arm64 host artifacts

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      flutter_ref:
        description: 'Flutter git ref (default: latest stable tag)'
        required: false
        default: ''
      mode:
        description: 'Which libc to build'
        required: false
        default: 'both'
        type: choice
        options: [both, bionic, glibc]

env:
  PYTHONUNBUFFERED: '1'

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Flutter stable tag
        id: resolve
        run: |
          set -euo pipefail
          REF="${{ inputs.flutter_ref }}"
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs https://github.com/flutter/flutter.git \
              | awk -F/ '$3 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ {print $3}' \
              | sort -V | tail -1)
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "Resolved Flutter stable: $REF"
          if gh release view "$REF" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-bionic:
    needs: detect
    if: needs.detect.outputs.changed == 'true' && (inputs.mode == '' || inputs.mode == 'both' || inputs.mode == 'bionic')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Restore pip cache
        id: cache-pip
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-linux-${{ hashFiles('requirements.txt') }}

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 python3-pip ninja-build \
            pkg-config wget xz-utils openjdk-21-jdk-headless
          pip3 install -r requirements.txt

      - name: Save pip cache
        if: always() && steps.cache-pip.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: pip-linux-${{ hashFiles('requirements.txt') }}

      - name: Restore depot_tools cache
        id: cache-depot
        uses: actions/cache/restore@v4
        with:
          path: ~/depot_tools
          key: depot-tools-v1

      - name: Set up depot_tools (cache miss)
        if: steps.cache-depot.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"

      - name: Save depot_tools cache
        if: always() && steps.cache-depot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/depot_tools
          key: depot-tools-v1

      - name: Add depot_tools to PATH
        run: echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Restore Flutter checkout (bionic)
        id: cache-src
        uses: actions/cache/restore@v4
        with:
          path: flutter-src
          key: flutter-src-bionic-${{ needs.detect.outputs.tag }}-${{ hashFiles('config/gclient', 'patches/engine.patch', 'patches/dart.patch', 'patches/skia.patch') }}

      - name: Checkout Flutter + engine — cache miss
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: bash scripts/sync.sh "${{ needs.detect.outputs.tag }}" bionic

      - name: Verify restored checkout — cache hit
        if: steps.cache-src.outputs.cache-hit == 'true'
        run: bash scripts/verify-sync.sh "${{ needs.detect.outputs.tag }}" bionic

      - name: Save Flutter checkout cache (bionic)
        if: always() && steps.cache-src.outputs.cache-hit != 'true' && hashFiles('flutter-src/bin/internal/engine.version') != ''
        uses: actions/cache/save@v4
        with:
          path: flutter-src
          key: flutter-src-bionic-${{ needs.detect.outputs.tag }}-${{ hashFiles('config/gclient', 'patches/engine.patch', 'patches/dart.patch', 'patches/skia.patch') }}

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-bionic-${{ needs.detect.outputs.tag }}
          path: |
            logs/**
            flutter-src/engine/src/.git/rebase-apply/**
          if-no-files-found: ignore

      - name: Restore Termux sysroot cache
        id: cache-sysroot
        uses: actions/cache/restore@v4
        with:
          path: sysroot
          key: sysroot-${{ hashFiles('scripts/sysroot.py', 'build.toml') }}-v1

      - name: Assemble Termux sysroot — cache miss
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        run: python3 scripts/sysroot.py --arch=arm64

      - name: Check Termux sysroot assembled
        id: sysroot-check
        run: |
          if [ -d sysroot/data/data/com.termux/files/usr ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Termux sysroot cache
        if: always() && steps.cache-sysroot.outputs.cache-hit != 'true' && steps.sysroot-check.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: sysroot
          key: sysroot-${{ hashFiles('scripts/sysroot.py', 'build.toml') }}-v1

      # The Termux patches import //build/config/sysroot.gni from the host
      # toolchain too, where current_toolchain != default_toolchain and the
      # custom_sysroot branch is skipped -- GN then wants the stock x64 sysroot.
      - name: Restore host x64 Debian sysroot cache
        id: cache-x64-sysroot
        uses: actions/cache/restore@v4
        with:
          path: flutter-src/engine/src/build/linux/debian_bullseye_amd64-sysroot
          key: debian-sysroot-x64-v1

      - name: Install host x64 Debian sysroot — cache miss
        if: steps.cache-x64-sysroot.outputs.cache-hit != 'true'
        run: |
          cd flutter-src/engine/src
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=x64

      - name: Save host x64 Debian sysroot cache
        if: always() && steps.cache-x64-sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: flutter-src/engine/src/build/linux/debian_bullseye_amd64-sysroot
          key: debian-sysroot-x64-v1

      - name: Build Android-target gen_snapshot (bionic, arm64)
        run: |
          for mode in release profile; do
            bash scripts/build-one.sh bionic arm64 "$mode"
          done

      - name: Verify binaries
        run: bash scripts/verify-artifacts.sh bionic

      - name: Package
        run: bash scripts/package-artifacts.sh bionic "${{ needs.detect.outputs.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bionic-${{ needs.detect.outputs.tag }}
          path: |
            dist/bionic/*.tar.gz
            dist/bionic/*.sha256

  build-glibc:
    needs: detect
    if: needs.detect.outputs.changed == 'true' && (inputs.mode == '' || inputs.mode == 'both' || inputs.mode == 'glibc')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Restore pip cache
        id: cache-pip
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/pip
          key: pip-linux-${{ hashFiles('requirements.txt') }}

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 python3-pip ninja-build \
            pkg-config wget xz-utils openjdk-21-jdk-headless
          pip3 install -r requirements.txt

      - name: Save pip cache
        if: always() && steps.cache-pip.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: pip-linux-${{ hashFiles('requirements.txt') }}

      - name: Restore depot_tools cache
        id: cache-depot
        uses: actions/cache/restore@v4
        with:
          path: ~/depot_tools
          key: depot-tools-v1

      - name: Set up depot_tools (cache miss)
        if: steps.cache-depot.outputs.cache-hit != 'true'
        run: git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"

      - name: Save depot_tools cache
        if: always() && steps.cache-depot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/depot_tools
          key: depot-tools-v1

      - name: Add depot_tools to PATH
        run: echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Restore Flutter checkout (glibc)
        id: cache-src
        uses: actions/cache/restore@v4
        with:
          path: flutter-src
          key: flutter-src-glibc-${{ needs.detect.outputs.tag }}-${{ hashFiles('config/gclient-glibc', 'patches/linux-arm64-aot-deps.patch', 'patches/linux-arm64-aot-engine.patch') }}

      - name: Checkout Flutter + engine — cache miss
        if: steps.cache-src.outputs.cache-hit != 'true'
        run: bash scripts/sync.sh "${{ needs.detect.outputs.tag }}" glibc

      - name: Verify restored checkout — cache hit
        if: steps.cache-src.outputs.cache-hit == 'true'
        run: bash scripts/verify-sync.sh "${{ needs.detect.outputs.tag }}" glibc

      - name: Save Flutter checkout cache (glibc)
        if: always() && steps.cache-src.outputs.cache-hit != 'true' && hashFiles('flutter-src/bin/internal/engine.version') != ''
        uses: actions/cache/save@v4
        with:
          path: flutter-src
          key: flutter-src-glibc-${{ needs.detect.outputs.tag }}-${{ hashFiles('config/gclient-glibc', 'patches/linux-arm64-aot-deps.patch', 'patches/linux-arm64-aot-engine.patch') }}

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diag-glibc-${{ needs.detect.outputs.tag }}
          path: |
            logs/**
            flutter-src/engine/src/.git/rebase-apply/**
          if-no-files-found: ignore

      - name: Restore aarch64 Debian sysroot cache
        id: cache-glibc-sysroot
        uses: actions/cache/restore@v4
        with:
          path: flutter-src/engine/src/build/linux/debian_bullseye_arm64-sysroot
          key: glibc-sysroot-arm64-v1

      - name: Install aarch64 Debian sysroot — cache miss
        if: steps.cache-glibc-sysroot.outputs.cache-hit != 'true'
        run: |
          cd flutter-src/engine/src
          python3 build/linux/sysroot_scripts/install-sysroot.py --arch=arm64

      - name: Save aarch64 Debian sysroot cache
        if: always() && steps.cache-glibc-sysroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: flutter-src/engine/src/build/linux/debian_bullseye_arm64-sysroot
          key: glibc-sysroot-arm64-v1

      - name: Build Android-target gen_snapshot (glibc, arm64)
        run: |
          for mode in release profile; do
            bash scripts/build-one.sh glibc arm64 "$mode"
          done

      - name: Verify binaries
        run: bash scripts/verify-artifacts.sh glibc

      - name: Package
        run: bash scripts/package-artifacts.sh glibc "${{ needs.detect.outputs.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: glibc-${{ needs.detect.outputs.tag }}
          path: |
            dist/glibc/*.tar.gz
            dist/glibc/*.sha256

  release:
    needs: [detect, build-bionic, build-glibc]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        run: |
          set -euo pipefail
          TAG="${{ needs.detect.outputs.tag }}"
          gh release create "$TAG" dist/*/* \
            --title "Flutter $TAG linux-arm64 host artifacts" \
            --generate-notes \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
